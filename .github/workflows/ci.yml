name: PDSChain v2 CI

on:
  push:
    branches: ['main', 'develop']
  pull_request:
    branches: ['main', 'develop']

jobs:
  quality-and-tests:
    name: Phase 1 Quality Gate (Lint, Typecheck, Build, Unit, Integration & Contracts)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pdschain
          POSTGRES_PASSWORD: pdschain_ci_test_password
          POSTGRES_DB: pdschain_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pdschain -d pdschain_v2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      APP_NAME: pdschain-v2
      LOG_LEVEL: info
      API_HOST: 127.0.0.1
      API_PORT: 4000
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      WEB_HOST: 127.0.0.1
      WEB_PORT: 5173
      WEB_URL: http://localhost:5173
      VITE_API_BASE_URL: http://127.0.0.1:4000/api/v1
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_USER: pdschain
      POSTGRES_PASSWORD: pdschain_ci_test_password
      POSTGRES_DB: pdschain_v2
      DATABASE_URL: postgresql://pdschain:pdschain_ci_test_password@127.0.0.1:5432/pdschain_v2?schema=public
      HARDHAT_RPC_URL: http://127.0.0.1:8545
      HARDHAT_CHAIN_ID: 31337

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run environment doctor
        run: npm run doctor

      - name: Generate Prisma Client & apply database migrations
        run: |
          npm run db:generate
          npm run db:migrate
          npm run db:status

      - name: Check formatting
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typechecks
        run: npm run typecheck

      - name: Build all workspaces and compile smart contracts
        run: npm run build

      - name: Run Backend & Frontend tests
        run: npm test

      - name: Run Smart Contract tests & local deployment smoke test
        run: |
          npm run contracts:test
          npm run contracts:deploy:local

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright browser smoke tests
        run: npm run test:e2e
